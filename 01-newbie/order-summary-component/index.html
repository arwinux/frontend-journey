<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Order summary card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Cormorant+Garamond:ital@1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/main.css" />
  </head>

  <body>
    <main class="container">
      <img class="pattern-background" />
      <!-- <div class="pattern-background"></div> -->
      <article class="order-summary">
        <figure class="order-summary__media">
          <img
            src="./assets/images/illustration-hero.svg"
            alt="Person listening to music with headphones"
          />
        </figure>

        <div class="order-summary__content">
          <div class="order-summary__header">
            <h1 class="order-summary__title">Order Summary</h1>
            <p class="order-summary__description">
              You can now listen to millions of songs, audiobooks, and podcasts
              on any device anywhere you like!
            </p>
          </div>
          <div class="order-summary__plan plan-card">
            <div class="plan-card__details">
              <div class="plan-card__icon">
                <img src="./assets/images/icon-music.svg" alt="music note" />
              </div>
              <div class="plan-card__info">
                <h2 class="plan-card__title">Annual Plan</h2>
                <span class="plan-card__price">$59.99/year</span>
              </div>
            </div>

            <a class="plan-card__change" href="#">Change</a>
          </div>

          <div class="order-summary__actions">
            <button class="btn btn-primary">Proceed to Payment</button>
            <button class="btn btn-cancel">Cancel Order</button>
          </div>
        </div>
      </article>
    </main>

    <a
      href="https://github.com/arwinux"
      target="_blank"
      rel="noopener noreferrer"
      class="sig-badge"
      id="sigBadge"
      tabindex="0"
      role="button"
      aria-expanded="false"
      aria-label="Show author, Arvin, Frontend Developer"
    >
      <span class="icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </span>

      <span class="label">Author</span>

      <span class="reveal">
        <span class="divider"></span>
        <span class="name">Arvin</span>
        <span class="divider"></span>
        <span class="role">Frontend Developer</span>
        <span class="tap-hint">tap again →</span>
      </span>
    </a>

    <script>
      (function () {
        var badge = document.getElementById("sigBadge");
        var isDesktop = window.matchMedia(
          "(hover: hover) and (pointer: fine)",
        ).matches;

        if (!isDesktop) {
          document.documentElement.classList.add("touch");
        }

        function setOpen(open) {
          badge.classList.toggle("is-open", open);
          badge.setAttribute("aria-expanded", open ? "true" : "false");
        }

        if (!isDesktop) {
          badge.addEventListener("click", function (e) {
            if (!badge.classList.contains("is-open")) {
              e.preventDefault();
              e.stopPropagation();
              setOpen(true);
            }
          });

          document.addEventListener("click", function () {
            setOpen(false);
          });
        }

        badge.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            if (!isDesktop && !badge.classList.contains("is-open")) {
              e.preventDefault();
              setOpen(true);
            }
          }
          if (e.key === "Escape") {
            setOpen(false);
          }
        });
      })();
    </script>
  </body>
</html>
