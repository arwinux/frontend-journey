<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Cormorant+Garamond:ital@1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/main.css" />

    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body>
    <main>
      <div class="profile">
        <div class="profile__banner">
          <img src="./assets/images/bg-pattern-card.svg" alt="profile banner" />
        </div>

        <div class="profile__avatar">
          <img src="./assets/images/image-victor.jpg" alt="" />
        </div>

        <div class="profile__info">
          <div class="profile__name-age">
            <span class="profile__name">Victor Crest</span>
            <span class="profile__age">26</span>
          </div>

          <p class="profile__country">London</p>
        </div>

        <div class="divider"></div>

        <div class="profile__stats">
          <div class="stat">
            <span class="stat__number">80K</span>
            <p class="stat__lable">Followers</p>
          </div>
          <div class="stat">
            <span class="stat__number">803K</span>
            <p class="stat__lable">Likes</p>
          </div>
          <div class="stat">
            <span class="stat__number">1.4K</span>
            <p class="stat__lable">Photos</p>
          </div>
        </div>
      </div>
    </main>

    <a
      href="https://github.com/arwinux"
      target="_blank"
      rel="noopener noreferrer"
      class="sig-badge"
      id="sigBadge"
      tabindex="0"
      role="button"
      aria-expanded="false"
      aria-label="Show author, Arvin, Frontend Developer"
    >
      <span class="icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </span>

      <span class="label">Author</span>

      <span class="reveal">
        <span class="divider"></span>
        <span class="name">Arvin</span>
        <span class="divider"></span>
        <span class="role">Frontend Developer</span>
        <span class="tap-hint">tap again →</span>
      </span>
    </a>
    <script type="module" src="./src/js/programmer-badge.js"></script>
  </body>
</html>
