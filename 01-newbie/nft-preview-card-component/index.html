<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./src/css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>NFT preview card component</title>
  </head>

  <body>
    <main>
      <article class="nft-card">
        <div class="nft-card__img">
          <img src="./assets/images/image-equilibrium.jpg" alt="nft image" />
          <div class="nft-card__img-view">
            <img src="./assets/images/icon-view.svg" alt="" />
          </div>
        </div>
        <div class="nft-card__content">
          <h3 class="nft-card__title text-hover">Equilibrium #3429</h3>
          <p class="nft-card__description">
            Our Equilibrium collection promotes balance and calm.
          </p>

          <div class="nft-card__price-deadline">
            <div class="nft-card__price badge">
              <img
                src="./assets/images/icon-ethereum.svg"
                alt="ethereum icon"
              />
              <span class="nft-card__price text-hover">0.041ETH</span>
            </div>
            <div class="nft-card__deadline badge">
              <img src="./assets/images/icon-clock.svg" alt="clock icon" />
              <span>3 days left</span>
            </div>
          </div>
        </div>
        <div class="nft-card__author">
          <div class="nft-card__author-img">
            <img src="./assets/images/image-avatar.png" alt="" />
          </div>

          <div class="nft-card__author-name">
            <span>Creation of</span>
            <span class="text-hover creator">Jules Wyvern</span>
          </div>
        </div>
      </article>
    </main>

    <a
      href="https://github.com/arwinux"
      class="sig-badge"
      id="sigBadge"
      tabindex="0"
      role="button"
      aria-expanded="false"
      aria-label="Show author"
    >
      <span class="icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </span>
      <!-- <span class="label">Author</span> -->

      <span class="reveal">
        <span class="divider"></span>
        <span class="name">Arvin</span>
        <span class="divider"></span>
        <span class="role">Frontend Developer</span>
      </span>
    </a>

    <script>
      // Click-to-toggle for touch devices (hover alone doesn't work on mobile).
      // Desktop still gets instant hover via CSS; this just adds a persistent
      // "open" state for tap/click, and closes when tapping outside.
      (function () {
        var badge = document.getElementById("sigBadge");

        function setOpen(open) {
          badge.classList.toggle("is-open", open);
          badge.setAttribute("aria-expanded", open ? "true" : "false");
        }

        badge.addEventListener("click", function (e) {
          e.stopPropagation();
          setOpen(!badge.classList.contains("is-open"));
        });

        badge.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            setOpen(!badge.classList.contains("is-open"));
          }
          if (e.key === "Escape") {
            setOpen(false);
          }
        });

        document.addEventListener("click", function () {
          setOpen(false);
        });
      })();
    </script>
  </body>
</html>
